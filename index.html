<head>

    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Preload critical font weights -->
  <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/Inter-Bold.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Self-host fonts -->
  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/Inter-Regular.woff2") format("woff2");
    }

    /* Or use variable font (1 file instead of 6) */
    @font-face {
      font-family: "Inter";
      font-weight: 300 800;
      src: url("/fonts/Inter-Variable.woff2") format("woff2-variations");
    }
  </style>
  <style>
    /* Smooth font rendering */
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #09090b;
    }

    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }

    /* Glow effects */
    .glow {
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.25),
        0 0 30px rgba(34, 211, 238, 0.15);
    }

    @media (min-width: 768px) {
      .glow {
        box-shadow: 0 0 20px rgba(34, 211, 238, 0.3),
          0 0 40px rgba(34, 211, 238, 0.2);
      }
    }

    .glow-text {
      text-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
    }

    @media (min-width: 768px) {
      .glow-text {
        text-shadow: 0 0 30px rgba(34, 211, 238, 0.5);
      }
    }

    /* Mobile menu animation */
    .mobile-menu {
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform, opacity;
    }

    .mobile-menu.closed {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }

    .mobile-menu.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* Backdrop blur for mobile menu */
    .menu-backdrop {
      transition: opacity 0.3s ease-in-out;
      backdrop-filter: blur(4px);
    }

    .menu-backdrop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Hamburger animation */
    .hamburger span {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(6px, 6px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
      transform: translateX(20px);
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
    }

    /* Navbar scroll effect */
    nav {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.3s ease;
    }

    nav.scroll-down {
      transform: translateY(-100%);
    }

    nav.scroll-up {
      transform: translateY(0);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
        0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    nav:has(#mobile-menu.open) {
      transform: translateY(0) !important;
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Button press effect */
    .btn-press {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-press:active {
      transform: scale(0.97);
    }

    /* Card hover effect */
    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    @media (hover: hover) {
      .card-hover:hover {
        transform: translateY(-4px);
      }
    }

    /* Better touch target sizes */
    @media (max-width: 768px) {

      a,
      button {
        min-height: 44px;
        min-width: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    }

    /* Gradient text animation */
    @keyframes gradient-shift {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    .gradient-animate {
      background-size: 200% 200%;
      animation: gradient-shift 3s ease infinite;
    }

    /* Pulse animation for badges */
    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
      }

      50% {
        box-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
      }
    }

    .pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    /* Safe area for notched devices */
    @supports (padding: max(0px)) {
      body {
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
      }
    }
  </style>

  <!-- Theme initialization script -->
  <script>
    if (!("theme" in localStorage)) {
      localStorage.setItem("theme", "dark");
    }

    if (localStorage.theme === "dark") {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }

    function initThemeIcons() {
      const isDark = document.documentElement.classList.contains("dark");

      const darkIconDesktop = document.getElementById("theme-toggle-dark-icon");
      const lightIconDesktop = document.getElementById("theme-toggle-light-icon");

      if (isDark) {
        if (darkIconDesktop) darkIconDesktop.classList.remove("hidden");
        if (lightIconDesktop) lightIconDesktop.classList.add("hidden");
      } else {
        if (darkIconDesktop) darkIconDesktop.classList.add("hidden");
        if (lightIconDesktop) lightIconDesktop.classList.remove("hidden");
      }

      const darkIconMobile = document.getElementById("theme-toggle-dark-icon-mobile");
      const lightIconMobile = document.getElementById("theme-toggle-light-icon-mobile");

      if (isDark) {
        if (darkIconMobile) darkIconMobile.classList.remove("hidden");
        if (lightIconMobile) lightIconMobile.classList.add("hidden");
      } else {
        if (darkIconMobile) darkIconMobile.classList.add("hidden");
        if (lightIconMobile) lightIconMobile.classList.remove("hidden");
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initThemeIcons);
    } else {
      initThemeIcons();
    }
  </script>
</head>
